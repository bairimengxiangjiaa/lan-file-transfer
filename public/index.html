<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0891b2">
    <title>局域网文件传输</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-512.png">
    <link rel="stylesheet" href="style.css">
    <script src="js/qrcode.min.js"></script>
    <script src="js/reconnect-core.js"></script>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>📁 局域网文件传输</h1>
            <div class="device-info">
                <span class="device-name" id="deviceName">设备名称</span>
                <button class="connection-status" id="connectionStatus" aria-label="连接状态">● 连接中...</button>
                <button class="btn-icon" id="themeToggle" title="切换深色/浅色模式" aria-label="切换深色/浅色模式">🌙</button>
            </div>
        </header>

        <!-- IP 变化提示条（默认隐藏） -->
        <div class="ip-change-banner" id="ipChangeBanner" style="display: none;">
            <span class="ip-change-icon">⚠️</span>
            <span class="ip-change-text">检测到 IP 地址已变化，请使用新地址访问</span>
            <span class="ip-change-new" id="ipChangeNewAddr">-</span>
            <button class="ip-change-close" id="ipChangeClose" aria-label="关闭提示">×</button>
        </div>

        <!-- 主要内容区 -->
        <main class="main-content">
            <!-- 左侧栏：连接信息 / 传输状态 / 在线设备 -->
            <aside class="sidebar">
                <!-- 连接信息卡片 -->
                <div class="connect-card" id="connectCard">
                    <div class="qrcode-wrap">
                        <div class="qrcode" id="qrcode"></div>
                        <div class="qrcode-label">手机连同一 WiFi，扫码访问</div>
                    </div>
                    <div class="connect-info">
                        <div class="connect-url">
                            <span class="label">访问地址</span>
                            <span class="url" id="connectUrl">-</span>
                            <button class="btn-copy" id="copyBtn" title="复制" aria-label="复制访问地址">📋</button>
                        </div>
                        <div class="connect-url connect-url-mdns" id="mdnsRow" style="display: none;">
                            <span class="label">备用地址</span>
                            <span class="url url-secondary" id="mdnsUrl">-</span>
                            <span class="mdns-hint">（iOS / Mac / Windows 支持，安卓请用上方 IP 地址）</span>
                        </div>
                        <div class="connect-hint">
                            电脑名：<span id="deviceHostname">-</span>
                            <span class="tip-highlight">💡 手机端“添加到桌面”可获得独立 App 体验</span>
                        </div>
                    </div>
                </div>
        
                <!-- 传输状态 -->
                <div class="transfer-section" id="transferSection" style="display: none;">
                    <div class="section-title">
                        <h2>传输状态</h2>
                        <button class="btn-text" id="clearDoneBtn">清除已完成</button>
                    </div>
                    <div class="transfer-list" id="transferList"></div>
                </div>
        
                <!-- 在线设备 -->
                <div class="device-section">
                    <div class="section-title">
                        <h2>在线设备</h2>
                        <span class="device-count" id="deviceCount">0</span>
                    </div>
                    <div class="device-list" id="deviceList">
                        <div class="empty-state">
                            <p>暂无其他设备</p>
                            <p class="hint">等待其他设备加入...</p>
                        </div>
                    </div>
                </div>
            </aside>
        
            <!-- 右侧：上传 + 文件列表 -->
            <section class="content">
                <!-- 上传区域（紧凑横向） -->
                <div class="upload-section">
                    <div class="drop-zone" id="dropZone">
                        <div class="drop-icon">📤</div>
                        <div class="drop-texts">
                            <p class="drop-text">拖拽文件或文件夹到页面任意位置上传</p>
                            <p class="drop-hint">或点击右侧按钮选择</p>
                        </div>
                        <input type="file" id="fileInput" multiple hidden>
                        <input type="file" id="folderInput" webkitdirectory directory hidden>
                        <div class="upload-buttons">
                            <button class="btn-upload" id="selectFileBtn">📄 选择文件</button>
                            <button class="btn-upload" id="selectFolderBtn">📁 选择文件夹</button>
                        </div>
                    </div>
                </div>
        
                <!-- 文件列表 -->
                <div class="file-section">
                    <div class="section-title">
                        <h2>已上传文件</h2>
                        <div class="section-actions">
                            <button class="btn-clear-all" id="clearAllBtn" title="清空所有文件" aria-label="清空所有文件">🗑️ 清空</button>
                            <button class="btn-refresh" id="refreshBtn" title="刷新" aria-label="刷新文件列表">🔄</button>
                        </div>
                    </div>
                    <div class="file-toolbar">
                        <input type="search" class="file-search" id="fileSearch" placeholder="🔍 搜索文件..." aria-label="搜索文件">
                        <select class="file-sort" id="fileSort" aria-label="排序方式">
                            <option value="time-desc">最新优先</option>
                            <option value="time-asc">最旧优先</option>
                            <option value="name-asc">名称 A-Z</option>
                            <option value="name-desc">名称 Z-A</option>
                            <option value="size-desc">从大到小</option>
                            <option value="size-asc">从小到大</option>
                        </select>
                        <button class="btn-select-all" id="selectAllBtn">☑ 全选</button>
                        <button class="btn-download-selected" id="downloadSelectedBtn" disabled>📦 下载选中</button>
                        <button class="btn-delete-selected" id="deleteSelectedBtn" disabled>🗑️ 删除选中</button>
                    </div>
                    <div class="file-list" id="fileList">
                        <div class="empty-state">
                            <p>暂无文件</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 设备名称设置弹窗 -->
    <div class="modal" id="nameModal">
        <div class="modal-content">
            <h2>设置设备名称</h2>
            <input type="text" id="nameInput" placeholder="输入设备名称" maxlength="20">
            <button class="btn-primary" id="setNameBtn">确定</button>
        </div>
    </div>

    <!-- 确认对话框（替代原生 confirm） -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h2 id="confirmTitle">确认操作</h2>
            <p class="confirm-message" id="confirmMessage"></p>
            <div class="modal-buttons">
                <button class="btn-secondary" id="confirmCancelBtn">取消</button>
                <button class="btn-danger" id="confirmOkBtn">确定</button>
            </div>
        </div>
    </div>

    <!-- 图片预览 Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose" aria-label="关闭预览">×</button>
        <img class="lightbox-img" id="lightboxImg" alt="图片预览">
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>

    <!-- 全页拖拽遮罩 -->
    <div class="drop-overlay" id="dropOverlay">
        <div class="drop-overlay-inner">
            <div class="drop-overlay-icon">📥</div>
            <p>松开即可上传</p>
        </div>
    </div>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
